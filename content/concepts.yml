    week: 3
    group: Errors and testing
    requires: [conditionals]
  - id: raise
    title: Raising exceptions
    week: 3
    group: Errors and testing
    requires: [exceptions]
  - id: modules
    title: Importing modules
    week: 4
    group: Going further
    requires: [functions]
  - id: random

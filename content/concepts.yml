    week: 0
    group: Python basics
    requires: [variables, strings]
  - id: numbers
    title: Integers and floats
    week: 0
    group: Python basics
    requires: [variables]
  - id: functions
    title: Defining functions
    week: 0
    group: Functions
    requires: [variables]
  - id: return-values
    title: Return values
    week: 0
    group: Functions
    requires: [functions]
  - id: comparisons

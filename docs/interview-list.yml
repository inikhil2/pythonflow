# Interview problem list: 100 easy, 100 medium, 100 hard.
# Source: LeetCode problem set, read on 2026-10-31 from the user's own logged-in tab (read only).
# Ranking: how often Google, Amazon, Meta, Apple and Netflix ask the problem (full weight),
#   Microsoft (half weight), other tagged companies (quarter weight). Highest first inside each tier.
# Free problems only. Database, shell, concurrency, interactive and "design" class problems are left out.
# Only the number, title, tags and link are used. All statements, tests and solutions are original.
# Link for each problem: https://leetcode.com/problems/<slug>/
# `order` is the position inside the tier. Easier lesson keys come first.
# `needs` holds lesson keys. Map a key to a lesson path with the table below.
#   week10-* lessons do not exist yet. They are written in task P5 before the medium tier.
#   `order` was ranked with the old keys. Re-rank by lesson level if the tier order matters.
#   Easy problems need only weeks 0 to 9, except easy 81 to 100 with ll, tree or heap keys.
#   Those wait for the week 10 lessons. Easy 80 (Longest Common Prefix) needs strings only.
lessons:
  ret: week0-functions/08-return-values
  strs: week0-functions/04-strings
  nums: week0-functions/06-numbers
  loops: week2-loops/02-for-and-range
  lists: week2-loops/03-lists
  dicts: week2-loops/04-dictionaries
  sets: week9-etcetera/01-sets
  comp: week9-etcetera/06-comprehensions
  cls: week8-objects/01-classes
  twop: week10-algorithms/01-two-pointers
  stack: week10-algorithms/02-stacks-and-queues
  prefix: week10-algorithms/03-prefix-sums-and-intervals
  heap: week10-algorithms/04-sorting-and-heaps
  bs: week10-algorithms/05-binary-search
  rec: week10-algorithms/06-recursion-and-backtracking
  ll: week10-algorithms/07-linked-lists
  tree: week10-algorithms/08-trees
  graph: week10-algorithms/09-graphs
  dp: week10-algorithms/10-dynamic-programming
